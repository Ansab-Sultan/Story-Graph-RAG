services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped

    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol

    environment:
      NEO4J_AUTH: "neo4j/password"

    volumes:
      - ./neo4j_data:/data

    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
